/* ── Entrada institucional · diagnóstico por facultad ────────────────── */
.brand-shield{width:64px;height:61px;object-fit:contain;flex:0 0 64px;filter:drop-shadow(0 3px 7px rgba(12,20,46,.16))}
.sidebar .brand-shield{width:48px;height:48px;flex-basis:48px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.25))}
.landing header .brand-shield{width:61px;height:61px}
.landing .header-right{display:flex;align-items:center;gap:16px}
.institution-seal{font-size:10px;letter-spacing:.12em;color:#667991;font-weight:800}
.faculty-landing{min-height:100vh;background:radial-gradient(circle at 2% 4%,rgba(230,173,9,.10),transparent 25%),radial-gradient(circle at 80% 93%,rgba(18,55,123,.07),transparent 28%),#f7f9fc}

.faculty-landing h1 em,.profile-landing h1 em{color:#12377B;font-style:normal}

.faculty-landing .lead{max-width:650px;font-size:16px}
.faculty-select-card{margin-top:30px;width:min(610px,100%);border:1px solid #dbe4f0;box-shadow:0 16px 65px rgba(20,54,115,.085);background:#fff;padding:25px;border-radius:20px;display:grid;gap:13px}
.faculty-select-card .step-label{font-size:10px;font-weight:860;letter-spacing:.14em;color:#b07d13}
.faculty-select-card label{font-weight:850;font-size:16px;color:#1a3158}
.faculty-select-card select{min-height:55px;border:1px solid #d1dceb;padding:10px 14px;border-radius:11px;background:white;color:#1c344f;width:100%;font-size:13px}
.faculty-select-card select:focus{outline:none;box-shadow:0 0 0 4px #17458320;border-color:#12377B}
.faculty-select-card .btn{white-space:normal;min-height:49px;line-height:1.3}
.faculty-select-card .tiny{margin:0;font-size:11px}
.faculty-hero-panel{background:linear-gradient(149deg,#15366f,#071d47)}
.hero-statement{font-size:22px;letter-spacing:-.03em;font-weight:750;max-width:350px;line-height:1.32}
.landing-bottom{padding:20px 6%;font-size:11px;color:#8897a8;text-align:center;border-top:1px solid #e8eef5}
.profile-landing{min-height:100vh;background:linear-gradient(180deg,#fafcff,#f0f5fb)}
.role-choice{width:min(850px,100%);margin:40px auto 70px;padding:10px 22px}
.role-choice h1{font-size:clamp(35px,4.4vw,54px);margin:15px 0 23px}
.role-choice h2{font-size:22px;margin:24px 0 8px}
.role-choice .rolelist{max-width:720px}
.faculty-selected{border:1px solid #d9e6f5;border-left:5px solid #E6AD09;padding:17px 19px;background:#fff;border-radius:12px;display:grid;gap:5px;box-shadow:0 7px 22px #12377b09}
.faculty-selected span{font-size:10px;letter-spacing:.13em;color:#73839a;font-weight:800}
.faculty-selected strong{color:#12377B;font-size:15px;letter-spacing:.02em}
.role-disclaimer{color:#73859e;font-size:12px;margin-top:19px;padding:13px 0;max-width:700px}
.auth-landing{background:linear-gradient(155deg,#f9fbff,#f2f6fb)}

/* ── Edición institucional: jerarquía funcional, navegación y accesibilidad ── */
:root{--unt-blue:#12377B;--unt-gold:#E6AD09;--unt-green:#0C8F3D;--unt-red:#D8261A;}
.institution-seal:empty{display:none}
.brand-caption{font-size:10px;max-width:215px;line-height:1.4;letter-spacing:.01em}
.landing-bottom{font-weight:600;color:#465c79}
.back-nav{appearance:none;background:#fff;border:1px solid #d8e2f0;color:#183e78;border-radius:12px;padding:10px 16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:760;font-size:13px;box-shadow:0 3px 10px rgba(10,44,100,.04);transition:background .2s,border-color .2s,transform .2s}
.back-nav:hover{background:#eaf2ff;border-color:var(--unt-blue);transform:translateX(-2px)}
.back-nav:focus-visible,.btn:focus-visible,.rolecard:focus-visible,.monthchip:focus-visible{outline:3px solid #e6ad09;outline-offset:3px}
.topbar .flex{gap:15px;flex-wrap:wrap}
.topbar .breadcrumb{font-size:12px;max-width:520px}
.function-layer{border:1px solid #bed0ee;background:linear-gradient(157deg,#f2f6fd 0,#fff 34%,#fff 100%);border-left:6px solid var(--unt-blue);border-top:3px solid #1e4a91;box-shadow:0 15px 40px #173f8110;margin:27px 0;padding:25px 27px 27px;position:relative}
.function-layer .compound-top{margin-bottom:20px;padding-bottom:13px;border-bottom:1px solid #dce7f7}
.function-layer .compound-top .idx{font-size:14px;letter-spacing:.09em;color:#fff;background:var(--unt-blue);padding:10px 17px;border-radius:10px;box-shadow:0 6px 14px rgba(18,55,123,.14)}
.shape-icon{font-size:11px;opacity:.72;display:none}
.function-layer> .field label{font-weight:850;color:#15366e;letter-spacing:.03em}
.activity-layer{margin:21px 0 21px 21px;border:1px solid #c5e4d6;border-left:5px solid #168a61;border-radius:15px;padding:20px 20px 22px;background:linear-gradient(180deg,#f4fbf7,#fff 45%);box-shadow:0 7px 19px #0c8f3d0b}
.activity-layer>.flex:first-child b{font-weight:900!important;font-size:13px!important;color:#126d4b!important;letter-spacing:.075em}
.activity-layer .field label{color:#274f42}
.product-layer{margin:16px 0 16px 21px;background:linear-gradient(130deg,#fffdf4,#fff 42%);border:1px solid #e8ddbd;border-left:4px solid #d6a22b;border-radius:13px;padding:19px 20px 20px;box-shadow:0 5px 15px #b0862210}
.product-layer>.flex:first-child .idx{background:#fff0be;color:#79520a;font-size:12px!important;font-weight:900;padding:8px 12px;border-radius:8px;letter-spacing:.045em}
.product-layer .input-grid{margin-top:10px}
.product-layer .field label{font-size:11px;color:#6a5c41}
.product-layer .monthchip.checked{background:#12377B;color:#fff;border-color:#12377B}
.function-layer .inline-help{line-height:1.75}
.academic-intro{background:#f4f8fe;border:1px solid #dce6f5;border-radius:12px;padding:14px 18px;display:grid;gap:3px;color:#12377B}
.academic-intro span{color:#677996;font-size:12px}
.academic-group{border:1px solid #dce8f5;background:#f9fbff;border-radius:15px;padding:17px;display:grid;gap:13px;grid-column:1 / -1}
.academic-group-title{color:#12377B;font-weight:850;letter-spacing:.08em;font-size:12px}
.academic-group .field{max-width:410px}
.degree-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.degree-list .field{max-width:none}
.is-hidden{display:none!important}
.rolecard:hover{box-shadow:0 14px 30px rgba(18,55,123,.10);border-color:#99b5dc}
/* Pantalla pública y zona de registro: siempre legible a 200 % */
@media(max-width:900px){.topbar{height:auto;min-height:72px;padding:12px 18px}.function-layer{padding:18px}.activity-layer{margin-left:10px}.product-layer{margin-left:10px}.degree-list{grid-template-columns:1fr}}

/* Jerarquía institucional: la Dirección General de Administración precede a la URH. */
.brand-dependency{display:flex;flex-direction:column;gap:2px;margin-top:5px;max-width:330px}
.brand-direction{font-family:inherit;font-size:12.5px;line-height:1.24;font-weight:850;letter-spacing:.01em;color:#12377B}
.brand-unit{font-family:inherit;font-size:10.5px;line-height:1.32;font-weight:550;color:#67768c}
.sidebar .brand-direction{color:#f5f8ff;font-size:11.25px;line-height:1.3}
.sidebar .brand-unit{color:#b4c8e6;font-size:9.75px}
.sidebar .brand{align-items:flex-start}
@media(max-width:600px){
 .landing header .brand-direction{font-size:10.4px}
 .landing header .brand-unit{font-size:9.4px}
 .landing header .brand-dependency{margin-top:3px;max-width:220px}
}

/* NIVEL EDUCATIVO Y ACREDITACIONES — CONTROLES DINÁMICOS */
.education-pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.education-choice{position:relative;display:flex;align-items:center;justify-content:center;min-height:56px;padding:10px 15px;border:1px solid #ccd9eb;border-radius:14px;background:#f8fafd;color:#12377B;font-weight:800;text-align:center;cursor:pointer;transition:.2s ease}
.education-choice:hover{border-color:#12377B;background:#edf3fc;transform:translateY(-1px)}
.education-choice.selected{background:#12377B;color:#fff;border-color:#12377B;box-shadow:0 8px 18px rgba(18,55,123,.20)}
.education-choice input{position:absolute;opacity:0;width:1px;height:1px}
.education-choice:focus-within{outline:3px solid #E6AD09;outline-offset:2px}
.academic-extra{display:grid;gap:18px;grid-column:1/-1;padding:16px 0}
.academic-extra.is-hidden{display:none}
.academic-block{background:#f8faff;border:1px solid #dce6f5;border-left:4px solid #E6AD09;padding:20px;border-radius:16px}
.academic-block-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:15px}
.academic-block-head b{font-size:17px;color:#12377B}
.academic-block-head p{margin:5px 0 0;color:#5f6c83;font-size:13px}
.academic-list{display:grid;gap:12px}
.academic-line{background:#fff;border:1px solid #e0e7f2;padding:16px;border-radius:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto;align-items:end;gap:12px}
.academic-line .field:first-child{grid-column:auto}
.academic-line:has([name^="academic_title_"]){grid-template-columns:minmax(0,1fr) auto}
.academic-line .field{min-width:0}
.academic-line .remove-academic{white-space:nowrap;min-height:44px}

solo, una evaluación individual de desempeño.</div></main></div></div>${ribbon()}${state.modal?modal():''}`;}

function input(name,label,value='',type='text',opts={}){const full=opts.full?' full':'';const hint=opts.hint?`<span class="hint">${esc(opts.hint)}</span>`:'';const check=/^prod_\d+_\d+_\d+_name$/.test(name)?`<div class="writing-check" data-writing-check="${esc(name)}" role="status" hidden></div>`:''; const required=opts.required?'required':'';const upp=opts.upper!==false&&type!=='email'?'upper':'';return `<div class="field${full}"><label for="${name}">${esc(label)}${required?' *':''}</label><input id="${name}" name="${name}" type="${type}" class="${upp}" value="${esc(value)}" ${required} ${opts.maxlength?`maxlength="${opts.maxlength}"`:''} ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''}/>${check}${hint}</div>`;}
function select(name,label,options,chosen='',opts={}){return `<div class="field ${opts.full?'full':''}"><label for="${name}">${esc(label)}${opts.required?' *':''}</label><select id="${name}" name="${name}" ${opts.required?'required':''}><option value="">Seleccione una opción</option>${options.map(x=>{const value=typeof x==='string'?x:x.value,label=typeof x==='string'?x:x.label;return `<option value="${esc(value)}" ${value===chosen?'selected':''}>${esc(label)}</option>`}).join('')}</select>${opts.hint?`<span class="hint">${esc(opts.hint)}</span>`:''}</div>`;}
function textarea(name,label,value='',opts={}){const check=/^(fn_desc_\d+|act_\d+_\d+)$/.test(name)?`<div class="writing-check" data-writing-check="${esc(name)}" role="status" hidden></div>`:'';return `<div class="field full"><label for="${name}">${esc(label)}${opts.required?' *':''}</label><textarea id="${name}" name="${name}" rows="${opts.rows||3}" ${opts.required?'required':''} placeholder="${esc(opts.placeholder||'')}" class="${opts.upper===false?'':'upper'}">${esc(value)}</textarea>${check}${opts.hint?`<span class="hint">${esc(opts.hint)}</span>`:''}</div>`;}
function profileView(){let p=state.profile||emptyProfile(state.role);return `<div class="card"><div class="section-head"><span class="section-mark">01</span><div><h3>Identificación personal y académica</h3><p class="muted tiny" style="margin:0">Consigne información vigente. Los nombres, apellidos y direcciones se registran en mayúsculas.</p></div></div><form id="profileForm"><div class="input-grid">${input('last_names','APELLIDOS',p.last_names,'text',{required:true})}${input('first_names','NOMBRES',p.first_names,'text',{required:true})}${input('dni','NÚMERO DE DOCUMENTO NACIONAL DE IDENTIDAD (DNI)',p.dni,'text',{required:true,maxlength:8,hint:'Ocho dígitos numéricos.'})}${input('worker_code','CÓDIGO DE TRABAJADOR',p.worker_code,'text',{required:true})}${input('job_title','DENOMINACIÓN DEL PUESTO QUE OCUPA',p.job_title||'','text',{required:true})}${input('address','DOMICILIO ACTUAL',p.address,'text',{required:true,full:true})}${input('phone','NÚMERO DE CELULAR',p.phone,'tel',{required:true,hint:'Ingrese su número de celular vigente (nueve dígitos).'})}${input('institutional_email','CORREO INSTITUCIONAL (UNITRU)',p.institutional_email,'email',{required:true,upper:false})}${input('personal_email','CORREO ELECTRÓNICO PERSONAL',p.personal_email,'email',{required:true,upper:false})}${academicView(p)}<div class="field"><label>FACULTAD DE ADSCRIPCIÓN *</label><input readonly value="FACULTAD DE ${esc(U(facultyName(p.faculty_id||state.selectedFaculty)))}" aria-label="Facultad seleccionada"><input name="faculty_id" type="hidden" value="${esc(p.faculty_id||state.selectedFaculty)}"></div>${(state.role==='authority'||prefStore.get('unt.requested_role')==='authority')?`${select('authority_scope','RESPONSABILIDAD ACADÉMICA O DE GOBIERNO',[{value:'DECANATO',label:'DECANO(A)'},{value:'ESCUELA',label:'DIRECTOR(A) DE ESCUELA PROFESIONAL'},{value:'DEPARTAMENTO',label:'DIRECTOR(A) DE DEPARTAMENTO ACADÉMICO'}],p.authority_scope||'',{required:true})}${input('authority_unit','ESCUELA PROFESIONAL O DEPARTAMENTO ACADÉMICO (SEGÚN CORRESPONDA)',p.authority_unit||'','text',{full:true,placeholder:'EJ. ESCUELA PROFESIONAL DE ECONOMÍA; NO CORRESPONDE SI ES DECANO'})}`:''}${input('org_unit','UNIDAD DE ORGANIZACIÓN DONDE DESEMPEÑA SUS LABORES',p.org_unit,'text',{required:true,full:true,placeholder:'EJ. SECRETARÍA ACADÉMICA, DECANATO, DIRECCIÓN DE ESCUELA...'})}</div><div class="divider"></div><div class="form-actions right"><button class="btn primary" type="submit">Continuar →</button></div></form></div>`;}
function normalizedAcademicProfile(p){const level=String(p.education_level||'').toUpperCase();const result={...p,education_level:['SECUNDARIA','TÉCNICO','SUPERIOR'].includes(level)?level:level.startsWith('SECUNDARIA')?'SECUNDARIA':level.includes('TÉCNIC')?'TÉCNICO':level?'SUPERIOR':(p.role==='authority'?'SUPERIOR':'')};let titles=Array.isArray(p.academic_titles)?p.academic_titles:[];let grades=Array.isArray(p.academic_grades)?p.academic_grades:[];if(!titles.length&&p.professional_title){titles=[{type:result.education_level==='TÉCNICO'?'TÉCNICO':'PROFESIONAL',name:p.professional_title}];}if(!grades.length){if(level==='BACHILLER')grades.push({level:'BACHILLER',name:p.higher_detail||''});const nM=Math.max(0,Number(p.masters_count)||0),nD=Math.max(0,Number(p.doctorates_count)||0);String(p.masters_detail||'').split('\n').slice(0,nM).forEach(name=>grades.push({level:'MAESTRÍA',name}));String(p.doctorates_detail||'').split('\n').slice(0,nD).forEach(name=>grades.push({level:'DOCTORADO',name}));}result.academic_titles=titles;result.academic_grades=grades;return result;}
function academicView(profile){const p=normalizedAcademicProfile(profile),level=p.education_level;const isHigher=level==='SUPERIOR',isTech=level==='TÉCNICO';return `<div class="academic-level-wrap full"><div class="field"><label id="education_title">NIVEL EDUCATIVO *</label><div class="education-pills" role="radiogroup" aria-labelledby="education_title">${[['SECUNDARIA','Secundaria'],['TÉCNICO','Técnico'],['SUPERIOR','Superior']].map(([code,label])=>`<label class="education-choice ${level===code?'selected':''}"><input type="radio" name="education_level" value="${code}" ${level===code?'checked':''} required><span>${label}</span></label>`).join('')}</div><span class="hint">Marque únicamente el nivel educativo alcanzado. Los grados y títulos se registran aparte, si corresponde.</span></div></div><div id="academic_extra" class="academic-extra full ${isTech||isHigher?'':'is-hidden'}">${input('higher_detail',isTech?'ESPECIALIDAD O PROGRAMA DE FORMACIÓN TÉCNICA':'CARRERA, PROGRAMA O ESPECIALIDAD DE ESTUDIOS SUPERIORES',p.higher_detail||'','text',{full:true,placeholder:'INDIQUE LA DENOMINACIÓN SI CORRESPONDE'})}<div class="academic-block"><div class="academic-block-head"><div><b>${isTech?'Títulos técnicos obtenidos':'Títulos obtenidos'}</b><p>Registre cada título que efectivamente posee. Si no tiene ninguno, puede dejar este apartado vacío.</p></div><button type="button" class="btn ghost sm" data-action="add-academic-title">+ Añadir título</button></div><div class="academic-list">${p.academic_titles.map((row,i)=>`<div class="academic-line"><div class="field"><label for="academic_title_${i}">TÍTULO ${i+1} · DENOMINACIÓN</label><input id="academic_title_${i}" class="upper" name="academic_title_${i}" value="${esc(row.name||'')}" placeholder="EJ. ${isTech?'TÉCNICO EN CONTABILIDAD':'CONTADOR PÚBLICO, ECONOMISTA, INGENIERO...'}" required></div><button class="btn ghost sm remove-academic" type="button" data-action="delete-academic-title" data-idx="${i}" aria-label="Eliminar título ${i+1}">Eliminar</button></div>`).join('')||'<p class="academic-empty">Sin títulos registrados.</p>'}</div></div>${isHigher?`<div class="academic-block"><div class="academic-block-head"><div><b>Grados académicos obtenidos</b><p>Agregue los grados que posee: bachiller, maestría o doctorado. Puede incorporar más de uno.</p></div><button type="button" class="btn ghost sm" data-action="add-academic-grade">+ Añadir grado</button></div><div class="academic-list">${p.academic_grades.map((row,i)=>`<div class="academic-line"><div class="field"><label for="academic_grade_${i}_level">GRADO ${i+1}</label><select id="academic_grade_${i}_level" name="academic_grade_${i}_level" required><option value="">Seleccione un grado</option>${['BACHILLER','MAESTRÍA','DOCTORADO'].map(x=>`<option value="${x}" ${row.level===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="academic_grade_${i}_name">DENOMINACIÓN DEL GRADO ${i+1}</label><input id="academic_grade_${i}_name" name="academic_grade_${i}_name" class="upper" value="${esc(row.name||'')}" placeholder="EJ. MAGÍSTER EN GESTIÓN PÚBLICA" required></div><button class="btn ghost sm remove-academic" type="button" data-action="delete-academic-grade" data-idx="${i}" aria-label="Eliminar grado ${i+1}">Eliminar</button></div>`).join('')||'<p class="academic-empty">Sin grados académicos registrados.</p>'}</div></div>`:''}</div>`;}
function updateAcademicVisibility(){const form=$('#profileForm');if(!form)return;state.profile={...(state.profile||{}),...formProfile()};state.profile=normalizedAcademicProfile(state.profile);if(state.profile.education_level==='SECUNDARIA'){state.profile.academic_titles=[];state.profile.academic_grades=[];state.profile.higher_detail='';}if(state.profile.education_level==='TÉCNICO'){state.profile.academic_grades=[];}render(true);}
function updateAcademicRows(action,idx){const form=$('#profileForm');if(!form)return;state.profile=normalizedAcademicProfile({...(state.profile||{}),...formProfile()});const titles=state.profile.academic_titles,grades=state.profile.academic_grades;if(action==='add-academic-title')titles.push({type:state.profile.education_level==='TÉCNICO'?'TÉCNICO':'PROFESIONAL',name:''});if(action==='delete-academic-title')titles.splice(idx,1);if(action==='add-academic-grade')grades.push({level:'',name:''});if(action==='delete-academic-grade')grades.splice(idx,1);render(true);}

function steps(){return state.role==='authority'?['Identificación','Necesidades de la unidad','Observaciones','Revisión']:['Identificación','Funciones y productos','Observaciones','Revisión'];}
function declaration(){const stages=steps();let step=state.step;return shell(`${pageTitle('REGISTRO INSTITUCIONAL',state.role==='authority'?'Necesidades de mi unidad':'Mi información funcional','Complete cada apartado de manera clara. Puede revisar toda su información antes de enviarla.')}
<div class="step-caption">ETAPA ${step+1} DE ${stages.length} · ${stages[step].toUpperCase()}</div><div class="stepper">${stages.map((n,i)=>`<div title="${n}" class="segment ${i===step?'active':i<step?'done':''}"></div>`).join('')}</div>${state.submission?.status==='submitted'||state.submission?.status==='validated'||state.submission?.status==='forwarded'?`<div class="callout bluecall" style="margin-bottom:17px">Su registro figura como <b>${statuses[state.submission.status][0]}</b>. Puede revisar los datos. Para registrar correcciones deberá remitirse una nueva ficha e indicar el código del registro anterior.</div>`:''}
${step===0?profileView():state.role==='authority'&&step===1?authorityView():step===1?functionsView():step===stages.length-2?observationsView():reviewView()}`,'Mi registro');}
function functionsView(){const data=state.submission?.content||emptyContent();const locked=isLocked();return `<div class="card"><div class="section-head"><span class="section-mark">02</span><div><h3>Funciones, actividades y productos</h3><p class="muted tiny" style="margin:0">Agregue tantas funciones como correspondan. Los productos se vinculan a sus respectivas actividades. Las observaciones de coherencia son orientativas y no impiden continuar.</p></div></div><div class="inline-help"><b>Cómo redactar una función:</b> <strong>VERBO EN INFINITIVO + SUJETO U OBJETO DE LA ACCIÓN + ATRIBUTO.</strong><br>Ejemplo: «Gestionar la documentación administrativa de la facultad para asegurar su trámite oportuno».<br><span class="tiny muted">Una función es una responsabilidad general; una actividad explica cómo se desarrolla; un producto es el resultado verificable. No se solicitan archivos ni evidencias en esta etapa.</span></div>
${data.functions.map((f,fi)=>functionCard(f,fi,locked)).join('')}
${!locked&&ai.open?aiAssistantPanel():''}${!locked?`<div class="btnrow"><button class="btn ghost" data-action="add-function">+ Agregar otra función</button></div>`:''}<div class="form-actions"><button class="btn ghost" data-action="prev-step">← Identificación</button><div class="btnrow"><button class="btn ghost" data-action="save-draft">Conservar temporalmente</button><button class="btn primary" data-action="next-step">Continuar →</button></div></div></div>`;}
// Panel contextual de apoyo: permanece oculto hasta que el usuario lo solicita junto a un campo.
function aiTargetKey(t){return `${t.kind}:${t.fi}:${t.ai}:${t.pi}`;}

 academica:/alumn|estudiant|matricul|horari|aula|clase|asisten|curso|docente|escuela|acta de notas|plan de estudio/i,

const normalizeWork=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function topicsFor(t){const q=normalizeWork(t);return Object.keys(coherenceGroups).filter(k=>coherenceGroups[k].test(q));}
function workRoots(t){const stop=new Set(['para','con','por','las','los','del','una','unos','unas','que','como','segun','sobre','desde','hasta','entre','mediante','facultad','unidad','organizacion','correspondiente','respectivo','realizar','asegurar','garantizar','trabajo','labor','segun','atencion','gestion','gestionar','actividades','administrativas','administrativos']);return normalizeWork(t).split(/[^a-z0-9]+/).filter(x=>x.length>4&&!stop.has(x)).map(w=>w.slice(0,Math.min(5,w.length)));}

 if(!text||text.length<10)return '';
 const first=text.match(/^[a-z]+/)?.[0]||'';
 const example='Ejemplo: «Gestionar la documentación administrativa de la facultad para contribuir a su atención oportuna».';
 if(!/(?:ar|er|ir)(?:se)?$/.test(first))
  return 'No se identifica un verbo en infinitivo al inicio. La estructura sugerida es VERBO EN INFINITIVO + OBJETO DE LA ACCIÓN + ATRIBUTO O FINALIDAD. '+example;
 const beforePurpose=text.split(/\b(?:para|a fin de|con la finalidad de|con el proposito de|conforme a|de acuerdo con|segun|mediante|en el marco de)\b/)[0];
 if(beforePurpose.split(/\s+/).filter(Boolean).length<4)
  return 'Conviene precisar qué se gestiona, coordina, organiza o realiza (objeto de la acción). '+example;
 if(!/\b(?:para|conforme a|segun|mediante|a fin de|de acuerdo con|con el proposito de|con la finalidad de|en el marco de|de manera|oportunamente|eficientemente|con criterios de|bajo criterios de|segun los|de acuerdo a)\b/.test(text))
  return 'Conviene precisar el atributo, alcance, condición o finalidad de esta responsabilidad. Estructura: VERBO EN INFINITIVO + OBJETO + ATRIBUTO. '+example;
 return '';
}
function adviceForField(el){const id=el?.id||'',value=el?.value?.trim()||'';if(!value||value.length<10)return '';
 if(/^fn_desc_\d+$/.test(id))return functionWritingAdvice(value);
 const a=id.match(/^act_(\d+)_(\d+)$/);if(a){const first=normalizeWork(value).match(/^[a-z]+/)?.[0]||'';
  if(!/(ar|er|ir)(se)?$/.test(first))return 'Revise la actividad: conviene formularla como una acción concreta iniciada con un verbo en infinitivo.';
  const fn=document.getElementById(`fn_desc_${a[1]}`)?.value?.trim()||'';
  if(!fn)return 'Registre la función para examinar la relación con esta actividad.';
  if(weakMismatch(fn,value))return 'Compruebe si esta actividad corresponde a la función registrada; la relación no resulta evidente en el texto.';
  return '';
 }
 const p=id.match(/^prod_(\d+)_(\d+)_(\d+)_name$/);if(p){const first=normalizeWork(value).match(/^[a-z]+/)?.[0]||'';
  if(/(ar|er|ir)(se)?$/.test(first))return 'Revise el producto: se espera un resultado o entregable verificable, no una acción.';
  const act=document.getElementById(`act_${p[1]}_${p[2]}`)?.value?.trim()||'';
  if(!act)return 'Registre la actividad vinculada antes de confirmar el producto.';
  if(weakMismatch(act,value))return 'Compruebe si el producto corresponde a la actividad descrita; la relación no resulta evidente en el texto.';
  return '';
 }
 return '';
}
function updateWritingAdvice(){if(state.nav!=='registro'||state.step!==1||state.role==='authority'||!state.submission)return;
 document.querySelectorAll('[data-writing-check]').forEach(box=>{const target=document.getElementById(box.dataset.writingCheck);if(!target)return;const advice=adviceForField(target);box.hidden=!advice;box.textContent=advice?('ⓘ '+advice):'';});
}
let adviceTimer=0;
function scheduleWritingAdvice(){clearTimeout(adviceTimer);adviceTimer=setTimeout(updateWritingAdvice,480);}
function functionCard(f,fi,locked){return `<section class="compound function-layer" data-fid="${esc(f.id)}"><div class="compound-top"><span class="idx"><span class="shape-icon">01</span> FUNCIÓN ${fi+1}</span>${!locked&&fi>0?`<button class="btn critical sm" data-action="delete-function" data-fi="${fi}">Eliminar función</button>`:''}</div>${textarea(`fn_desc_${fi}`,'DESCRIBA LA FUNCIÓN QUE DESEMPEÑA',f.description,{required:true,rows:5,hint:'Ejemplo: COORDINAR LA RECEPCIÓN Y DERIVACIÓN DE EXPEDIENTES PARA ASEGURAR LA ATENCIÓN DE LOS TRÁMITES.'})}${!locked?aiTrigger('function',fi):''}<div class="divider"></div><div class="flex space-between"><b style="font-size:14px">Actividades vinculadas a esta función</b>${!locked?`<button class="btn ghost sm" data-action="add-activity" data-fi="${fi}">+ Añadir actividad</button>`:''}</div>${f.activities.map((a,ai)=>activityCard(fi,ai,a,locked)).join('')}${textarea(`fn_note_${fi}`,'PRECISIONES DE LA FUNCIÓN (OPCIONAL)',f.notes,{rows:3,placeholder:'OTRAS PARTICULARIDADES DEL TRABAJO'})}</section>`;}
function activityCard(fi,ai,a,locked){return `<div class="activity-card activity-layer"><div class="flex space-between" style="margin-bottom:13px"><b style="font-size:12px;color:#2e698e">ACTIVIDAD ${fi+1}.${ai+1}</b>${!locked&&ai>0?`<button class="btn critical sm" data-action="delete-activity" data-fi="${fi}" data-ai="${ai}">Quitar actividad</button>`:''}</div>${textarea(`act_${fi}_${ai}`,'¿QUÉ ACCIONES RELACIONADAS REALIZA?',a.description,{rows:4,hint:'Ejemplo: REVISAR Y REGISTRAR SOLICITUDES RECIBIDAS DE LOS USUARIOS.'})}${!locked?aiTrigger('activity',fi,ai):''}<div class="flex space-between" style="margin-top:16px"><b class="tiny">Productos o entregables de esta actividad</b>${!locked?`<button class="btn ghost sm" data-action="add-product" data-fi="${fi}" data-ai="${ai}">+ Agregar producto</button>`:''}</div>${a.products.map((p,pi)=>productCard(fi,ai,pi,p,locked)).join('')}</div>`;}
function productCard(fi,ai,pi,p,locked){const pre=`prod_${fi}_${ai}_${pi}`;const mon=D.months.map(m=>`<button type="button" data-action="toggle-month" data-fi="${fi}" data-ai="${ai}" data-pi="${pi}" data-month="${m}" class="monthchip ${(p.months||[]).includes(m)?'checked':''}">${m.slice(0,3)}</button>`).join('');return `<div class="prod-card product-layer"><div class="flex space-between" style="margin-bottom:12px"><span class="idx" style="font-size:11px">PRODUCTO ${fi+1}.${ai+1}.${pi+1}</span>${!locked&&pi>0?`<button class="btn critical sm" data-action="delete-product" data-fi="${fi}" data-ai="${ai}" data-pi="${pi}">Eliminar</button>`:''}</div><div class="input-grid">${input(`${pre}_name`,'PRODUCTO O ENTREGABLE',p.name,'text',{required:true,full:true,placeholder:'EJ. EXPEDIENTES REGISTRADOS Y DERIVADOS'})}${!locked?aiTrigger('product',fi,ai,pi):''}${select(`${pre}_frequency`,'PERIODICIDAD DE SU ELABORACIÓN',D.frequency,p.frequency)}${input(`${pre}_unit`,'UNIDAD DE MEDIDA',p.unit,'text',{placeholder:'EJ. EXPEDIENTES/SEMANA'})}${input(`${pre}_normal`,'VOLUMEN HABITUAL (APROX.)',p.normal,'number',{hint:'Cantidad en la unidad indicada.'})}${input(`${pre}_peak`,'VOLUMEN EN PERIODO CRÍTICO (APROX.)',p.peak,'number',{hint:'Si no puede estimarlo, deje vacío.'})}</div><div style="margin:17px 0 8px"><label class="bold tiny">MESES O PERIODOS DE MAYOR DEMANDA</label><div class="chiplist" style="margin-top:9px">${mon}</div><div class="hint tiny muted" style="margin-top:8px">Seleccione los meses en que habitualmente aumenta la cantidad de trabajo. Si no aplica, no seleccione.</div></div>
<div class="grid three" style="margin-top:20px">${rangeWidget(pre,'intensity','INTENSIDAD DE TRABAJO',p.intensity,'1 = baja · 10 = muy alta')}${rangeWidget(pre,'complexity','DIFICULTAD / COMPLEJIDAD',p.complexity,'1 = sencilla · 10 = muy compleja')}${rangeWidget(pre,'priority','PRIORIDAD INSTITUCIONAL',p.priority,'1 = baja · 10 = crítica')}</div>
<div class="divider"></div><div class="input-grid">${select(`${pre}_origin`,'¿DÓNDE SE INICIA ESTE TRÁMITE O PROCESO?',[{value:'inicia',label:'SE INICIA EN MI UNIDAD DE ORGANIZACIÓN'},{value:'continua',label:'ES CONTINUIDAD DE OTRA UNIDAD DE ORGANIZACIÓN'},{value:'independiente',label:'NO CORRESPONDE A UN TRÁMITE ENCADENADO'}],p.origin)}${input(`${pre}_previous_unit`,'UNIDAD DE ORGANIZACIÓN DE ORIGEN (SI CORRESPONDE)',p.previous_unit,'text',{placeholder:'UNIDAD DE ORGANIZACIÓN REMITENTE'})}${input(`${pre}_next_unit`,'¿A QUÉ UNIDAD DE ORGANIZACIÓN SE REMITE O ENTREGA?',p.next_unit,'text',{placeholder:'UNIDAD DE ORGANIZACIÓN DESTINATARIA O USUARIO FINAL'})}${input(`${pre}_reason`,'¿QUÉ OCASIONA LOS INCREMENTOS DE TRABAJO?',p.reason,'text',{placeholder:'MATRÍCULA, CIERRE ACADÉMICO, PLAZOS...'})}</div>${textarea(`${pre}_notes`,'OBSERVACIONES DEL PRODUCTO (OPCIONAL)',p.notes,{rows:3})}</div>`;}
function rangeWidget(pre,key,label,value,description){return `<div class="field"><label>${label}</label><div class="range-row"><input type="range" min="1" max="10" step="1" name="${pre}_${key}" value="${Number(value)||5}" data-range-output="${pre}_${key}"/><output class="rangemark" id="out_${pre}_${key}">${Number(value)||5}/10</output></div><div class="scale-caption"><span>${description.split(' · ')[0]}</span><span>${description.split(' · ')[1]||''}</span></div></div>`;}
function observationsView(){return `<div class="card"><div class="section-head"><span class="section-mark">${'03'}</span><div><h3>Observaciones y condiciones de trabajo</h3><p class="muted tiny" style="margin:0">Indique únicamente información relacionada con el trabajo institucional. No incluya acusaciones personales ni datos sensibles de terceros.</p></div></div>${textarea('general_observations',state.role==='authority'?'OBSERVACIONES DE LA AUTORIDAD':'OBSERVACIONES DEL SERVIDOR',state.submission.content.observations,{rows:7,hint:'Puede informar obstáculos, duplicidades, limitaciones de sistemas, problemas de coordinación u oportunidades de mejora.'})}<div class="form-actions"><button class="btn ghost" data-action="prev-step">← Regresar</button><div class="btnrow"><button class="btn ghost" data-action="save-draft">Conservar temporalmente</button><button class="btn primary" data-action="next-step">Revisar registro →</button></div></div></div>`;}
function authorityView(){const a=state.submission.content.authority;return `<div class="card"><div class="section-head"><span class="section-mark">02</span><div><h3>Necesidades funcionales de la unidad</h3><p class="muted tiny" style="margin:0">Para decanos, directores de escuela y directores de departamento. Describa las necesidades de su unidad.</p></div></div><div class="callout bluecall">Describa necesidades organizacionales, no calificaciones personales. Cada situación constituye un registro preliminar que la URH deberá contrastar técnicamente.</div>${authorityGroup('needs','Funciones necesarias no atendidas','Identifique responsabilidades o productos requeridos que no se realizan o se atienden insuficientemente.',['FUNCIÓN REQUERIDA','ACTIVIDADES Y PRODUCTOS ESPERADOS','FRECUENCIA Y PERIODO DE DEMANDA','¿POR QUÉ NO SE ATIENDE?'],a.needs)}${authorityGroup('revisions','Funciones o procedimientos que requieren revisión','Registre tareas duplicadas, procesos innecesarios o actividades que no corresponden a la unidad.',['FUNCIÓN O ACTIVIDAD','SITUACIÓN OBSERVADA','FRECUENCIA / ALCANCE','PROPUESTA DE MEJORA'],a.revisions)}${authorityGroup('outsourcing','Servicios externos o locaciones recurrentes','Distinga locación de servicios y tercerización. Registrar continuidad no presume irregularidad.',['SERVICIO O ACTIVIDAD CONTRATADA','ENTREGABLES','PERIODICIDAD Y CONTINUIDAD','JUSTIFICACIÓN / ALTERNATIVA'],a.outsourcing)}${authorityGroup('difficulties','Dificultades del funcionamiento administrativo','Describa problemas verificables, frecuencia e impacto, sin atribuir culpas personales.',['DIFICULTAD OPERATIVA','PROCESO AFECTADO','FRECUENCIA E IMPACTO','MEDIDA PROPUESTA'],a.difficulties)}<div class="form-actions"><button class="btn ghost" data-action="prev-step">← Regresar</button><div class="btnrow"><button class="btn ghost" data-action="save-draft">Conservar temporalmente</button><button class="btn primary" data-action="next-step">Continuar →</button></div></div></div>` function syncFunctionFields(){if(!state.submission||state.nav!=='registro')return;const content=state.submission.content;

function validateProfile(p){if(!/^\d{8}$/.test(p.dni)){notice('El DNI debe contener exactamente ocho dígitos.');return false}if(!/^\d{9}$/.test(p.phone.replace(/\D/g,''))){notice('Revise el número de celular (debe contener nueve dígitos).' );return false}if(!['SECUNDARIA','TÉCNICO','SUPERIOR'].includes(p.education_level)){notice('Seleccione uno de los tres niveles educativos.');return false}if(p.education_level==='SUPERIOR'&&p.academic_grades.some(g=>!g.level||!g.name.trim())){notice('Complete los grados académicos que agregó.');return false}if(p.education_level!=='SECUNDARIA'&&p.academic_titles.some(t=>!t.name.trim())){notice('Complete los títulos que agregó.');return false}if(p.requested_role==='authority'&&(!p.authority_scope||(p.authority_scope!=='DECANATO'&&!p.authority_unit?.trim()))){notice('Indique el cargo de autoridad y la escuela o departamento correspondiente.');return false}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.personal_email)||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.institutional_email)){notice('Revise los correos electrónicos.');return false}return true}

async function facultyApi(action,params={}){
  if(demo)return {ok:true};
  if(!configured||!sb)throw new Error('Supabase todavía no está configurado.');
  const {data:{session}}=await sb.auth.getSession();
  if(!session)throw new Error('La revisión de datos ajenos requiere supervisión de la URH en este navegador.');
  const response=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/functions/v1/unt-faculty-supervised',{
    method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.supabaseAnonKey,'Authorization':'Bearer '+session.access_token},
    body:JSON.stringify({faculty_id:state.selectedFaculty,action,...params})
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data.ok)throw new Error(data.error||'No se pudo completar la operación');
  return data;
}

function downloadDispatchWord(dispatchId){

function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function loadRemote(){
 if(demo||!state.session)return;
 const uid=state.session.user.id;
 const p=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();
 if(p.error)throw p.error;
 if(!p.data||p.data.role!=='urh_admin')throw new Error('La cuenta no tiene autorización URH.');
 state.profile=normalizedAcademicProfile(p.data);state.role='urh_admin';
 // Paginación: no omitir fichas por el límite de 1000 filas de PostgREST.
 const rows=[];
 for(let offset=0;offset<20000;offset+=500){
   const result=await sb.from('intake_submissions').select('*')
     .in('status',['validated','forwarded'])
     .order('created_at',{ascending:false}).order('id',{ascending:true})
     .range(offset,offset+499);
   if(result.error)throw result.error;
   const batch=result.data||[];rows.push(...batch);
   if(batch.length<500)break;
   if(offset===19500)throw new Error('Se alcanzó el límite de consulta; contacte al administrador técnico.');
 }
 state.records=rows.map(r=>({...r,role:r.role_at_submission,
   owner_name:r.owner_name||[r.profile?.last_names,r.profile?.first_names].filter(Boolean).join(', '),
   job_title:r.job_title||r.profile?.job_title||'',
   worker_code:r.worker_code||r.profile?.worker_code||'',
   org_unit:r.org_unit||r.profile?.org_unit||'',content:r.content||emptyContent()}));
 const [metrics,dispatches]=await Promise.all([
   sb.from('faculty_metrics').select('*'),
   sb.from('unt_intake_dispatches').select('*').eq('status','forwarded').order('created_at',{ascending:false}).limit(1000)
 ]);
 if(metrics.error)throw metrics.error;
 if(dispatches.error)throw dispatches.error;
 state.metrics=metrics.data||[];state.directory=[];state.dispatches=dispatches.data||[];
}

app.addEventListener('input',e=>{if(e.target.id==='ai_work_desc'){ai.description=e.target.value;const count=$('#ai-char-count');if(count)count.textContent=ai.description.length+'/3500';}if(e.target.id==='ai_more')ai.detalleNuevo=e.target.value;if(e.target.hasAttribute('data-ai-answer'))ai.respuestas[Number(e.target.dataset.aiAnswer)]=e.target.value;if(e.target.hasAttribute('data-ai-field')){syncAiDraft();if(e.target.id==='ai_edit_fn'){const warning=$('.ai-function-alert');if(warning){const advice=functionWritingAdvice(e.target.value);warning.hidden=!advice;warning.textContent=advice?'ⓘ '+advice:'';}}}if(e.target.matches('[type=range]')){const out=document.getElementById('out_'+e.target.name);if(out)out.textContent=e.target.value+'/10';}if(state.nav==='registro'&&state.step>0&&!e.target.closest('.ai-drawer')){syncFunctionFields();if(/^(fn_desc_\d+|act_\d+_\d+|prod_\d+_\d+_\d+_name)$/.test(e.target.id))scheduleWritingAdvice()}});
app.addEventListener('focusout',e=>{if(/^(fn_desc_\d+|act_\d+_\d+|prod_\d+_\d+_\d+_name)$/.test(e.target.id||''))updateWritingAdvice();});
app.addEventListener('change',e=>{if(e.target.id==='filter_faculty'){state.filterFaculty=e.target.value;render()}if(e.target.name==='education_level'){updateAcademicVisibility()}if(e.target.name==='authority_scope'){const t=document.getElementById('authority_unit');if(t){t.required=e.target.value==='ESCUELA'||e.target.value==='DEPARTAMENTO';t.placeholder=e.target.value==='DECANATO'?'NO CORRESPONDE': 'Indique el nombre de la escuela o departamento académico';}}});
app.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;if(form.id==='facultySelectionForm'){state.selectedFaculty=form.elements.faculty.value;prefStore.set('unt.faculty',state.selectedFaculty);if(!state.selectedFaculty){notice('Seleccione una facultad para continuar.');return}state.screen='landing';render()}else if(form.id==='profileForm'){if(await persistProfile()){state.step=1;render()}}else if(form.id==='loginForm'){const eMail=form.elements.email.value.trim().toLowerCase();if(state.role==='urh_admin'){if(demo){state.screen='workspace';state.nav='dashboard';render();notice('Acceso de navegación ficticio.');}else await authUrhPassword(eMail,form.elements.password.value)}}else if(form.id==='metricForm'){await saveMetrics(form)}else if(form.id==='forwardForm'){if(!form.elements.confirmation.checked)return notice('Confirme que se ha gestionado la firma.');await forwardDispatch(form.elements.dispatch_id.value,form.elements.office_number.value,form.elements.physical_reference.value)}});
setInterval(()=>{if(!demo&&state.role==='urh_admin'&&state.screen==='workspace'&&['dashboard','registros'].includes(state.nav)&&state.session&&!state.modal){refreshUrh(true)}},60000);
async function init(){if(!demo&&configured){try{if(!window.supabase?.createClient){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';script.onload=resolve;script.onerror=()=>reject(new Error('No se pudo cargar el servicio de autenticación.'));document.head.appendChild(script)})}sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);const {data,error}=await sb.auth.getSession();if(error)throw error;state.session=data.session;if(data.session){try{await loadRemote();state.screen='workspace';state.nav='dashboard'}catch(e){await sb.auth.signOut();state.session=null;state.screen='faculty';state.role=null;}}sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'&&state.role==='urh_admin'){state.session=null;state.screen='faculty';state.role=null;state.profile=null;render();}});}catch(e){console.error(e);notice('No se pudo conectar con Supabase: '+e.message)}}render();}
init();
})();
</script></body></html>
